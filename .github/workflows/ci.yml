name: CI

# One job. What it proves: the TypeScript compiles, the site builds, and the
# five offline tests pass. What it cannot prove: anything involving the
# database, the OCR pipeline, or money — those need credentials, paid APIs and
# a GPU, and are checked by hand. See README.md.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      # The build needs the public Supabase variables to exist at module scope.
      # Placeholders are enough: nothing here connects to a database.
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      # Offline: no API keys, no credits, no network. Each exits non-zero on
      # the first failure, so the job fails with the test that broke named.
      - name: Offline tests
        run: |
          for t in tests/test_*.py; do
            echo "--- $t"
            python "$t"
          done
